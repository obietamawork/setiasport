; Nilai ini sengaja disamakan dengan yang kita minta ke shared hosting
; (lihat docs/10-spesifikasi-hosting.md) supaya masalah upload preview desain
; ketahuan di lokal, bukan setelah deploy.

memory_limit = 256M
max_execution_time = 120

; Preview desain dibatasi 10 MB (KEP-002); beri kelonggaran untuk overhead form.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 30

date.timezone = Asia/Jakarta

; Tampilkan error hanya di lokal. Di produksi diatur lewat APP_DEBUG.
display_errors = On
error_reporting = E_ALL
