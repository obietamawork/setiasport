name: setiasport

services:
  app:
    build:
      context: ./docker/php
    container_name: setiasport-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # Dua direktori di bawah ini sengaja TIDAK ikut mount Windows.
      #
      # OPcache memeriksa tanggal setiap berkas yang di-cache (setiap 2 detik),
      # dan satu stat lewat mount Windows berbiaya milidetik. Dengan ~600 berkas
      # vendor, satu permintaan halaman menghabiskan 5-7 detik hanya untuk itu.
      # Menaruhnya di volume Linux memangkasnya jadi ~200 ms, dan karena kode
      # aplikasi tetap di mount, hasil edit tetap langsung terlihat tanpa
      # membersihkan cache apa pun.
      #
      # Konsekuensinya: `composer install` untuk container dijalankan DI DALAM
      # container. Entrypoint melakukannya otomatis saat volume masih kosong.
      # vendor/ di host tetap ada dan tetap dipakai IDE untuk autocomplete.
      #
      # node_modules dikosongkan dengan sengaja: Vite dijalankan di host
      # (`npm run build`), container tidak pernah membutuhkannya. Menyembunyikannya
      # mengurangi berkas yang harus disinkronkan Docker Desktop.
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public

  db:
    image: mysql:8.0
    container_name: setiasport-db
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: setiasport
      MYSQL_USER: setiasport
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"          # 3307 di host agar tidak bentrok dengan MySQL lokal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Menggantikan cron shared hosting. Di produksi, service ini diganti satu baris:
  #   * * * * * cd /path/app && php artisan schedule:run >> /dev/null 2>&1
  scheduler:
    build:
      context: ./docker/php
    container_name: setiasport-scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Pengganti Pusher untuk lokal (KEP-030). Berbicara dengan protokol yang sama,
  # jadi aplikasi memakai driver 'pusher' di kedua tempat dan chat CS bisa dicoba
  # realtime tanpa akun Pusher. Di produksi service ini TIDAK ada: shared hosting
  # tidak bisa memegang websocket, jadi tugasnya diambil Pusher cloud.
  reverb:
    build:
      context: ./docker/php
    container_name: setiasport-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8082:8080"          # 8081 sudah dipakai Adminer
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    environment:
      # Diisi dari .env lewat interpolasi compose, supaya kunci Reverb dan kunci
      # yang dipakai aplikasi untuk mengirim tidak pernah berbeda.
      REVERB_APP_ID: ${PUSHER_APP_ID}
      REVERB_APP_KEY: ${PUSHER_APP_KEY}
      REVERB_APP_SECRET: ${PUSHER_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: setiasport-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  vendor:
  node_modules:
